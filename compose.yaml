services:
  test-db:
    profiles: ['test']
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: product_finder
      POSTGRES_PASSWORD: product_finder
      POSTGRES_DB: product_finder_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U product_finder -d product_finder_test']
      interval: 2s
      timeout: 3s
      retries: 30
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: product_finder
      POSTGRES_PASSWORD: product_finder
      POSTGRES_DB: product_finder
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U product_finder -d product_finder']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://product_finder:product_finder@db:5432/product_finder
      PORT: 3000
    ports:
      - '127.0.0.1:3100:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:8180:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
